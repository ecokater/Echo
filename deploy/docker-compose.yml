# Amber 后端上云：Postgres + FastAPI 后端 + Caddy(自动 HTTPS 反代)
# 用法见 docs/DEPLOY.md。在本目录执行： docker compose up -d --build
#
# 可在本目录放一个 .env 覆盖下面的默认值（POSTGRES_PASSWORD / SITE_ADDRESS 等）。

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amber_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-amber}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amber} -d ${POSTGRES_DB:-amber}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../Amber/amber-engine
    restart: unless-stopped
    # .env 提供 SECRET_KEY / ADMIN_PHONES / 计费等；DATABASE_URL 由下方 environment 覆盖指向 db
    env_file:
      - ../Amber/amber-engine/.env
    environment:
      ENV: ${ENV:-prod}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-amber}:${POSTGRES_PASSWORD:-amber_pwd}@db:5432/${POSTGRES_DB:-amber}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    # 如需绕过 Caddy 直接调试，取消下一行注释（仅绑定本机回环）：
    # ports:
    #   - "127.0.0.1:8000:8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 有域名：SITE_ADDRESS=amber.example.com → Caddy 自动签发 Let's Encrypt HTTPS
      # 无域名先用 IP：保持默认 :80（纯 HTTP，仅建议临时测试）
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
